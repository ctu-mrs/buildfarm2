name: stable_thirdparty_dockers

on:
  workflow_dispatch:

  schedule:
    - cron:  '0 15 * * *'

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  VARIANT: stable
  APP_LIST: thirdparty

jobs:

  generate-jobs:
    runs-on: ubuntu-22.04
    outputs:
      group_last: ${{steps.generate.outputs.group_last}}
      app_list: ${{steps.generate.outputs.app_list}}
      variant: ${{steps.generate.outputs.variant}}
    env:
      PUSH_TOKEN: ${{secrets.PUSH_TOKEN}}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: 'recursive'
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          repository: ctu-mrs/ci_scripts
          ref: ros2
          path: ci_scripts
          token: ${{secrets.PUSH_TOKEN}}
      - id: generate
        run: |
          # docker images have no inter-package build order, one group is enough
          echo "group_last=$(./scripts/get_docker_build_matrix.sh ${{env.APP_LIST}} ${{env.VARIANT}})" >> "$GITHUB_OUTPUT"
          # republish it for the reusable workflow calls, which cannot read the env context
          echo "app_list=${{env.APP_LIST}}" >> "$GITHUB_OUTPUT"
          echo "variant=${{env.VARIANT}}" >> "$GITHUB_OUTPUT"

  build-group-last:
    needs: generate-jobs
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable_docker_group.yml
    with:
      group_json: ${{ needs.generate-jobs.outputs.group_last }}
      runs_on: ubuntu-22.04
      max_parallel: 5
      build_script: ./scripts/docker_build/build.sh
      app_list: ${{ needs.generate-jobs.outputs.app_list }}
      variant: ${{ needs.generate-jobs.outputs.variant }}
    secrets: inherit
