name: reusable_collect_artifacts

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner environment (e.g., ubuntu-22.04 or ubuntu-22.04-arm)'
        required: true
        type: string
      variant:
        description: 'VARIANT environment variable'
        required: true
        type: string
      artifacts_folder:
        description: 'ARTIFACTS_FOLDER environment variable (optional)'
        required: false
        type: string
        default: '/tmp/artifacts'
    secrets:
      PUSH_TOKEN:
        required: true
    outputs:
      has_debs:
        description: 'Whether any deb packages were built and deployed'
        value: ${{ jobs.collect-artifacts.outputs.has_debs }}

jobs:
  collect-artifacts:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      has_debs: ${{ steps.check_debs.outputs.has_debs }}
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      VARIANT: ${{ inputs.variant }}
      ARTIFACTS_FOLDER: ${{ inputs.artifacts_folder }}
    steps:
      - name: Load artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: ${{env.ARTIFACTS_FOLDER}}
      - id: execute
        run: |
          rm ${{env.ARTIFACTS_FOLDER}}/compiled.txt 2> /dev/null || true
          rm ${{env.ARTIFACTS_FOLDER}}/base_sha.txt 2> /dev/null || true
      - id: check_debs
        run: |
          DEBS_COUNT=$(find "${{env.ARTIFACTS_FOLDER}}" -type f -name "*.deb" 2>/dev/null | wc -l)
          echo "has_debs=$([ $DEBS_COUNT -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
      - name: Checkout CI scripts
        if: steps.check_debs.outputs.has_debs == 'true'
        uses: actions/checkout@v6
        with:
          repository: ctu-mrs/ci_scripts
          ref: ros2
          path: ci_scripts
          token: ${{secrets.PUSH_TOKEN}}
      - name: Deploy
        if: steps.check_debs.outputs.has_debs == 'true'
        run: ./ci_scripts/package_build/push_to_ppa.sh ${{env.VARIANT}} ${{env.ARTIFACTS_FOLDER}}

  delete_builder:
    needs: collect-artifacts
    if: always()
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: true
    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: '${{github.event.repository.name}}'
          older-than: 7 days
          keep-n-tagged: 1
          token: ${{secrets.PUSH_TOKEN}}
